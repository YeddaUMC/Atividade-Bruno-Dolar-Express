<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10">
    <title>Cotação do Dólar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Cotação do Dólar</h1>
                <p class="mb-0">USD em relação ao Real</p>
            </div>
            <span class="moeda">USD / BRL</span>
        </div>
    </header>

    <main class="container py-5">
        <section class="painel mx-auto shadow-sm">
            <p class="rotulo mb-1">Valor atual</p>
            <h2 id="valorAtual" class="valor-principal mb-4">Carregando...</h2>

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="bloco h-100">
                        <p class="rotulo mb-1">Maior valor do dia</p>
                        <h3 id="maiorValor" class="h4 fw-bold mb-0">--</h3>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="bloco h-100">
                        <p class="rotulo mb-1">Menor valor do dia</p>
                        <h3 id="menorValor" class="h4 fw-bold mb-0">--</h3>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top small text-secondary">
                Última atualização: <span id="ultimaAtualizacao">--</span>
            </div>

            <div id="erro" class="alert alert-danger mt-3 d-none mb-0">
                Não foi possível carregar a cotação.
            </div>
        </section>
    </main>

    <footer class="text-center pb-4 text-secondary small">
        Dados fornecidos pela AwesomeAPI
    </footer>

    <script src="script.js"></script>
</body>
</html>
